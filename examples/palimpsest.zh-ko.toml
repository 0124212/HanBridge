# Dad preset: Chinese → Korean (copy to your document folder as `palimpsest.toml`).
# Then run: palimpsest translate "document.pdf"
# (or the wrapper: python skills/translate-doc/translate.py "document.pdf" --backend workbuddy)
#
# Keys come from the environment / .env — never put them in this file.

schema = 1

[language]
source = "zh"
target = "ko"

[paths]
source_dir = "."
output_dir = "./translated"

[backend]
name = "workbuddy"        # Dad's Tencent TokenHub/Token Plan quota, no VPN
fallback = "translatepy"  # free no-key fallback if the primary refuses

[backend.google]
batch_size = 20
pause_seconds = 0.35

# Scanned/image PDFs: OCR with Simplified-Chinese tessdata (matches
# OcrConfig default). Windows installer fetches chi_sim.traineddata and
# sets TESSDATA_PREFIX; override here if yours lives elsewhere.
[ocr]
enabled = true
language = "chi_sim"

# Dual (bilingual 双语对照 PDF): no config field — the palimpsest CLI and the
# wrapper default to dual ON. Opt out per-run with:
#   python skills/translate-doc/translate.py "document.pdf" --no-dual
